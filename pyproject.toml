[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgex-agents"
version = "0.3.0"
description = "Evidence-gated, long-running scientific research agent team"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = "MIT"

[project.urls]
Homepage = "https://github.com/KashyapSinh-Gohil/edgex-agents"
Issues = "https://github.com/KashyapSinh-Gohil/edgex-agents/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
edgex = "edgex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
edgex = ["assets/skills/*/SKILL.md", "assets/skills/*/references/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
